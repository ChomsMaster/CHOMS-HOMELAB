---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: threadfin-config
  namespace: media
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: choms-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: threadfin
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: threadfin
  ports:
  - name: http
    port: 34400
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threadfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: threadfin
  template:
    metadata:
      labels:
        app: threadfin
    spec:
      securityContext:
        fsGroup: 31337
      containers:
      - name: threadfin
        image: fyb3roptik/threadfin@sha256:863fb0c2945617b4aa48b79eaa655954df72d68fbee6e49a1465934ceb3f057e
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Europe/Madrid
        ports:
        - name: http
          containerPort: 34400
        volumeMounts:
        - name: config
          mountPath: /home/threadfin/conf
        - name: temp
          mountPath: /tmp/threadfin
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: threadfin-config
      - name: temp
        emptyDir: {}
      enableServiceLinks: false
