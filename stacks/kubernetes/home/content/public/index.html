<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHOMS Master</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #1e3a8a, transparent 35%), #070b14;
      color: #f8fafc;
      text-align: center;
      padding: 24px;
    }
    main {
      max-width: 720px;
      padding: 42px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(15,23,42,.82);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(56,189,248,.14);
      color: #38bdf8;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1;
      letter-spacing: -0.05em;
    }
    p {
      margin: 24px auto 0;
      max-width: 560px;
      color: #94a3b8;
      font-size: 18px;
      line-height: 1.6;
    }
    footer {
      margin-top: 32px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">CHOMS Master</div>
    <h1>Estamos en construcción.</h1>
    <p>La web oficial de CHOMS Master estará disponible pronto. Estamos preparando infraestructura, servicios y nuevos proyectos.</p>
    <footer>Infraestructura propia · HTTPS · Powered by CHOMS-HOMELAB</footer>
  </main>
</body>
</html>
