---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-nginx-config
  namespace: apps
data:
  default.conf: "server {\n    listen 80;\n    server_name home.chomsmaster.com;\n\
    \n    root /usr/share/nginx/html;\n    index index.html;\n\n    location / {\n\
    \        add_header Cache-Control \"no-store, no-cache, must-revalidate, proxy-revalidate,\
    \ max-age=0\" always;\n        add_header Pragma \"no-cache\" always;\n      \
    \  add_header Expires \"0\" always;\n        try_files $uri $uri/ /index.html;\n\
    \    }\n}\n\nserver {\n    listen 80;\n    server_name www.chomsmaster.com chomsmaster.com;\n\
    \n    root /usr/share/nginx/public;\n    index index.html;\n\n    location / {\n\
    \        try_files $uri $uri/ /index.html;\n    }\n}\n"
---
