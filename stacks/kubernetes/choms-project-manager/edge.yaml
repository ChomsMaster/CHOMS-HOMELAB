apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: career-auth
  namespace: choms-project-manager
spec:
  forwardAuth:
    address: http://authelia.security.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: false
    authRequestHeaders: [Cookie]
    authResponseHeaders: [Remote-User]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: choms-project-manager
  namespace: choms-project-manager
spec:
  hostnames: [career.chomsmaster.com]
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: career-auth
      backendRefs:
        - name: choms-project-manager
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: career-https-redirect
  namespace: choms-project-manager
spec:
  hostnames: [career.chomsmaster.com]
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: web
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
