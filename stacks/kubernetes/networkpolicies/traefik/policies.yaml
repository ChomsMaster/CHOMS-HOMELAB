apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-default-deny
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-dns
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
