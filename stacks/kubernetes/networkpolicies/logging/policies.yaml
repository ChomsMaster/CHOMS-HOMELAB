# Propuesta local; NO aplicada. Véase docs/operations/NETWORK_POLICIES.md
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-default-deny
  namespace: logging
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-dns
  namespace: logging
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-scrape-logging-in
  namespace: logging
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 12345
    - protocol: TCP
      port: 3100
    - protocol: TCP
      port: 3500
    - protocol: TCP
      port: 4040
---
