# Propuesta local; NO aplicada. Véase docs/operations/NETWORK_POLICIES.md
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-default-deny
  namespace: security
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-dns
  namespace: security
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-edge-authelia-in
  namespace: security
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector:
    matchLabels:
      app: authelia
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 9091
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-authelia-redis-out
  namespace: security
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector:
    matchLabels:
      app: authelia
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: databases
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
