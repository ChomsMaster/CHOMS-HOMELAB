apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choms-api-portainer
  namespace: apps
  labels:
    app.kubernetes.io/part-of: choms-network-hardening
spec:
  podSelector:
    matchLabels:
      app: portainer
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    - ipBlock:
        cidr: 192.168.1.138/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
