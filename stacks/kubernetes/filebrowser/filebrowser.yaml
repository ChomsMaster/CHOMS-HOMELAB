apiVersion: v1
kind: Namespace
metadata:
  name: filebrowser
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  type: ClusterIP
  selector:
    app: filebrowser
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      securityContext:
        fsGroup: 1000

      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:s6
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi

          volumeMounts:
            - name: storage
              mountPath: /srv
            - name: config
              mountPath: /config
            - name: database
              mountPath: /database

      volumes:
        - name: storage
          nfs:
            server: 192.168.1.167
            path: /srv/storage

        - name: config
          nfs:
            server: 192.168.1.167
            path: /srv/storage/docker/filebrowser/config

        - name: database
          nfs:
            server: 192.168.1.167
            path: /srv/storage/docker/filebrowser/database
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  hostnames:
    - fbrowser.chomsmaster.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: filebrowser
          port: 80
          weight: 1
