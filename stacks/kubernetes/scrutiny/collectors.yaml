apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scrutiny-collector
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: scrutiny-collector
  template:
    metadata:
      labels:
        app: scrutiny-collector
    spec:
      nodeSelector:
        scrutiny-collector: "enabled"

      containers:
        - name: collector
          image: ghcr.io/analogj/scrutiny:v0.8.2-collector
          imagePullPolicy: IfNotPresent

          securityContext:
            privileged: true

          env:
            - name: COLLECTOR_API_ENDPOINT
              value: http://192.168.1.138:8083

            - name: COLLECTOR_HOST_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: COLLECTOR_RUN_STARTUP
              value: "true"

            - name: COLLECTOR_CRON_SCHEDULE
              value: "0 */6 * * *"

          volumeMounts:
            - name: udev
              mountPath: /run/udev
              readOnly: true

            - name: dev
              mountPath: /dev

      volumes:
        - name: udev
          hostPath:
            path: /run/udev
            type: Directory

        - name: dev
          hostPath:
            path: /dev
            type: Directory
