apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-from-cognee
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/part-of: choms-memory
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: cognee-api
          app.kubernetes.io/part-of: choms-memory
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cognee-to-postgresql
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cognee-api
      app.kubernetes.io/part-of: choms-memory
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/part-of: choms-memory
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cognee-dns
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cognee-api
      app.kubernetes.io/part-of: choms-memory
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cognee-from-control-plane
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cognee-api
      app.kubernetes.io/part-of: choms-memory
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 192.168.1.138/32
    - ipBlock:
        cidr: 10.42.0.0/32
    ports:
    - protocol: TCP
      port: 8000
