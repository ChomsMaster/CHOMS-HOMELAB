metadata:
  name: choms-memory
  namespace: choms-memory
  labels: &id001
    app.kubernetes.io/name: choms-memory
    app.kubernetes.io/part-of: choms-memory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
