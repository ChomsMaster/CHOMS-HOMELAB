apiVersion: v1
kind: Service
metadata:
  name: cognee-api
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cognee-api
    app.kubernetes.io/part-of: choms-memory
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee-api
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cognee-api
      app.kubernetes.io/part-of: choms-memory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cognee-api
        app.kubernetes.io/part-of: choms-memory
    spec:
      serviceAccountName: choms-memory
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: choms-node-02
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cognee-api
        image: docker.io/library/choms-cognee-local-tokenizer:1.6.5-p204a2a7e1d17
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: cognee-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-runtime
              key: app-password
        - name: VECTOR_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-runtime
              key: app-password
        - name: DEFAULT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cognee-runtime
              key: user-password
        - name: FASTAPI_USERS_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cognee-runtime
              key: jwt-secret
        - name: FASTAPI_USERS_RESET_PASSWORD_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: cognee-runtime
              key: reset-secret
        - name: FASTAPI_USERS_VERIFICATION_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: cognee-runtime
              key: verification-secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 500m
            memory: 8Gi
          limits:
            cpu: '2'
            memory: 16Gi
        volumeMounts:
        - name: data
          mountPath: /cognee-storage
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /src/fastino/gliner2.5-base-v1
          subPath: models-76fb6636f317812a/hub/models--fastino--gliner2.5-base-v1/snapshots/54785d51df8d86a0d8f2eb212fec15871aad2c4d
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: cognee-data
      - name: tmp
        emptyDir: {}
