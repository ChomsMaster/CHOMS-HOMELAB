    \ 0.19.0.\n\nThe caller fences all writers and commits purge_pending before calling\
    \ this module.\nNo user-provided path or dataset name is accepted by the public\
    \ adapter.\n\"\"\"\nimport os\nimport stat\nimport uuid\nfrom dataclasses import\
    \ dataclass\nfrom pathlib import Path\n\nCONTRACT = \"cognee-1.6.5-ladybug-0.19.0-v1\"\
    \nSUFFIXES = (\"\", \".wal\", \".lock\", \".shadow\", \".tmp\", \".wal.checkpoint\"\
    ,\n            \".checkpoint.intent.lock\", \".checkpoint.apply.lock\")\n\n\n\
    class PurgePending(RuntimeError):\n    \"\"\"Sanitized failure: caller must retain\
    \ its content-free reconciliation record.\"\"\"\n\n\n@dataclass(frozen=True)\n\
