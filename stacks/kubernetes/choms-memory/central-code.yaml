    \ not in ('global', 'personal', 'project') or (scope == 'project') != bool(project):\n\
    \        raise Fault('invalid_scope')\n    if project is not None and (not isinstance(project,\
    \ str) or not 1 <= len(project) <= 100):\n        raise Fault('invalid_project')\n\
    \    return scope, project or ''\n\n\ndef record_input(payload, *, explicit, real_allowed=False,\
