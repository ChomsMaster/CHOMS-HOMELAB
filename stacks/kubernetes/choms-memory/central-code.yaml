  001.sql: "CREATE TABLE IF NOT EXISTS choms_memory.schema_version(version integer\
    \ PRIMARY KEY);\nCREATE TABLE IF NOT EXISTS choms_memory.records (\n id uuid PRIMARY\
    \ KEY, lineage_id uuid NOT NULL, body jsonb,\n scope text NOT NULL CHECK(scope\
    \ IN ('global','personal','project')),\n project text NOT NULL, topic text NOT\
    \ NULL,\n state text NOT NULL CHECK(state IN ('candidate','active','superseded','expired','purge_pending')),\n\
    \ revision integer NOT NULL CHECK(revision>0), vector_info jsonb,\n projection_state\
    \ text NOT NULL CHECK(projection_state IN ('none','pending','ready','purge_pending')),\n\
    \ content_hash text\n);\nCREATE UNIQUE INDEX IF NOT EXISTS one_active_topic ON\
    \ choms_memory.records(scope,project,topic) WHERE state='active';\nCREATE INDEX\
    \ IF NOT EXISTS memory_scope ON choms_memory.records(scope,project,state);\nCREATE\
    \ TABLE IF NOT EXISTS choms_memory.receipts(\n request_id uuid PRIMARY KEY, operation\
    \ text NOT NULL, target_id uuid NOT NULL,\n fingerprint text NOT NULL\n);\nCREATE\
    \ TABLE IF NOT EXISTS choms_memory.tombstones(\n id uuid PRIMARY KEY, state text\
    \ NOT NULL CHECK(state='forgotten'),\n revision integer NOT NULL, request_ids\
    \ uuid[] NOT NULL\n);\nINSERT INTO choms_memory.schema_version VALUES(1) ON CONFLICT\
    \ DO NOTHING;\nCREATE TABLE IF NOT EXISTS choms_memory.purge_jobs (\n id uuid\
    \ PRIMARY KEY, members uuid[] NOT NULL, request_ids uuid[] NOT NULL\n);\n"
