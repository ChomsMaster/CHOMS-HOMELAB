apiVersion: v1
kind: Namespace
metadata:
  name: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: choms-memory-local
  labels:
    app.kubernetes.io/part-of: choms-memory
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: choms-memory
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cognee-data
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: choms-memory-local
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: choms-memory
  labels:
    app.kubernetes.io/part-of: choms-memory
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: choms-memory-local
  resources:
    requests:
      storage: 10Gi
