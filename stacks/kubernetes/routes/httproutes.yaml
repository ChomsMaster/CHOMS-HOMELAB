---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: choms-controller
  namespace: apps
spec:
  hostnames:
  - controller.chomsmaster.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik
    namespace: traefik
    sectionName: web
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik
    namespace: traefik
    sectionName: websecure
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: choms-controller
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
