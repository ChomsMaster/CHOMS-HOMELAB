backend:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
chunksCache:
  enabled: false
compactor:
  replicas: 0
deploymentMode: Monolithic
distributor:
  replicas: 0
gateway:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
indexGateway:
  replicas: 0
ingester:
  replicas: 0
loki:
  analytics:
    reporting_enabled: false
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    delete_request_store: filesystem
    retention_enabled: true
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h
    volume_enabled: true
  schemaConfig:
    configs:
    - from: "2024-04-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
lokiCanary:
  enabled: true
minio:
  enabled: false
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
read:
  replicas: 0
resultsCache:
  enabled: false
singleBinary:
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 20Gi
    storageClass: choms-nfs
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
test:
  enabled: false
write:
  replicas: 0
