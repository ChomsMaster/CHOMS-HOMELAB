providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false

gatewayClass:
  enabled: true
  name: traefik

ingressClass:
  enabled: false

deployment:
  kind: Deployment
  replicas: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
          topologyKey: kubernetes.io/hostname

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
