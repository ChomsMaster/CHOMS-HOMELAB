---
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: jellyfin
  ports:
  - name: http
    port: 8096
    targetPort: 8096
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        kubernetes.io/hostname: choms-node-02
      securityContext:
        fsGroup: 1000
        supplementalGroups:
        - 44
        - 992
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: TZ
          value: Europe/Madrid
        ports:
        - name: http
          containerPort: 8096
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
        - name: media
          mountPath: /media
        - name: dri
          mountPath: /dev/dri
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 6Gi
      volumes:
      - name: config
        hostPath:
          path: /data/docker/jellyfin-node02/config
          type: Directory
      - name: cache
        hostPath:
          path: /data/docker/jellyfin-node02/cache
          type: Directory
      - name: media
        hostPath:
          path: /mnt/choms-media
          type: Directory
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
