apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-default-deny
  labels:
    app.kubernetes.io/part-of: choms-platforms
  namespace: omniroute
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-from-traefik
  labels:
    app.kubernetes.io/part-of: choms-platforms
  namespace: omniroute
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: choms-platforms
      app.kubernetes.io/name: omniroute
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 20128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-to-redis
  labels:
    app.kubernetes.io/part-of: choms-platforms
  namespace: omniroute
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: choms-platforms
      app.kubernetes.io/name: omniroute
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: choms-platforms
          app.kubernetes.io/name: omniroute-redis
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-omniroute
  labels:
    app.kubernetes.io/part-of: choms-platforms
  namespace: omniroute
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: choms-platforms
      app.kubernetes.io/name: omniroute-redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: choms-platforms
          app.kubernetes.io/name: omniroute
    ports:
    - protocol: TCP
