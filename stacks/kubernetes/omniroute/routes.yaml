apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: omniroute-authelia
  labels:
    app.kubernetes.io/part-of: choms-platforms
  namespace: omniroute
spec:
  forwardAuth:
    address: http://authelia.security.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
    - Remote-User
    - Remote-Groups
    - Remote-Email
    - Remote-Name
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omniroute-dashboard
  labels:
    app.kubernetes.io/part-of: choms-platforms
  namespace: omniroute
spec:
  hostnames:
  - omniroute.chomsmaster.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik
    namespace: traefik
    sectionName: websecure
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    - path:
        type: PathPrefix
        value: /dashboard
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: PathPrefix
        value: /_next
    - path:
        type: PathPrefix
        value: /login
    - path:
        type: PathPrefix
        value: /home
    - path:
        type: Exact
        value: /favicon.ico
    backendRefs:
    - group: ''
      kind: Service
      name: omniroute
      port: 20128
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: omniroute-authelia
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omniroute-https-redirect
  labels:
    app.kubernetes.io/part-of: choms-platforms
  namespace: omniroute
spec:
  hostnames:
  - omniroute.chomsmaster.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik
    namespace: traefik
    sectionName: web
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 308
