services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: choms-jellyfin-node02
    hostname: choms-jellyfin-node02
    restart: unless-stopped
    user: "1000:1000"

    ports:
      - "8096:8096"

    volumes:
      - /data/docker/jellyfin-node02/config:/config
      - /data/docker/jellyfin-node02/cache:/cache
      - /mnt/choms-media:/media

    environment:
      TZ: Europe/Madrid

    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8096/System/Info/Public >/dev/null || exit 1'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

